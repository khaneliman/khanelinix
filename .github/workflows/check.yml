name: Check
permissions:
  contents: read
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    name: Check flake on ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Nix flake inputs
        if: matrix.system == 'x86_64-linux'
        uses: DeterminateSystems/flake-checker-action@v14
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system = ${{ matrix.system }}
      - uses: cachix/cachix-action@v17
        with:
          name: khanelinix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Run flake checks
        if: matrix.system == 'x86_64-linux'
        run: nix flake check --system ${{ matrix.system }} --print-build-logs
      - name: Evaluate Darwin outputs
        if: matrix.system == 'aarch64-darwin'
        # --no-build makes the store read-only, breaking partition loading and
        # input patching on fresh runners. Evaluate derivations without building
        # their outputs; checks includes Darwin systems and their embedded homes.
        run: |
          for output in checks packages devShells; do
            nix eval --json ".#${output}.${{ matrix.system }}" \
              --apply 'builtins.mapAttrs (_: value: value.drvPath)'
          done
          nix eval --raw .#formatter.${{ matrix.system }}.drvPath
